# Servidor da tela em produção (porta 8080, sem root).
# O navegador fala só com este endereço: a tela é servida daqui e /api e /health vão para a API.

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Envio de transcrição/responsograma: a API aceita até 10 MB por arquivo.
  client_max_body_size 12m;

  # O Docker resolve o nome `api`; reconsulta a cada 10 s (a API pode trocar de IP ao reiniciar).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API: cabeçalhos de segurança e cache vêm dela; aqui só se repassa o endereço de quem acessa.
  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # A análise roda em segundo plano, mas uploads e respostas grandes podem demorar.
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }

  location /health {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  # Arquivos com nome gerado pelo build (hash): podem ser guardados por um ano.
  location /assets/ {
    include /etc/nginx/bonsai-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Qualquer outro endereço devolve a tela (rotas do React); a página inicial nunca fica em cache.
  location / {
    include /etc/nginx/bonsai-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
